<!doctype html>
<html lang="en">
<head>

<title>VALKR — Coming soon</title>

<!-- Link-in-Bio fuer TikTok. Bewusst ohne externe Schriften, Skripte, Tracking oder Formulare:
     keine Einwilligung noetig, Impressum und Datenschutz mit einem Klick erreichbar. -->
<style>
  :root{--bg:#000;--ink:#F1ECE2;--ink2:#A9A6A0;--ink3:#6F6C66;--gold:#D4AF37;--line:#1E1D1B;
    --fd:"Segoe UI Semibold","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --fb:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:var(--fb);-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column}
  main{flex:1;width:min(100% - 2.4rem,26rem);margin:0 auto;padding:max(2.6rem,env(safe-area-inset-top)) 0 2rem;
    display:flex;flex-direction:column;align-items:center;text-align:center}
  .mark{width:92px;height:92px;display:block;filter:drop-shadow(0 0 18px rgba(212,175,55,.28))}
  .word{font-family:var(--fd);font-weight:600;font-size:2rem;letter-spacing:.42em;text-indent:.42em;
    margin:1rem 0 0;line-height:1}
  .rule{width:84px;height:2px;background:var(--gold);margin:1.2rem auto 0;border:0}
  .claim{font-size:1.35rem;font-weight:500;margin:1.1rem 0 0}
  .soon{font-family:var(--fm);color:var(--gold);font-size:.8rem;letter-spacing:.46em;text-indent:.46em;margin:.7rem 0 0}
  figure{margin:2rem 0 0;width:100%}
  figure img{display:block;width:100%;height:auto;border-radius:22px;border:1px solid var(--line)}
  .ask{font-size:1.15rem;font-weight:600;line-height:1.35;margin:2rem 0 0}
  .ask small{display:block;font-weight:400;color:var(--ink2);font-size:.95rem;margin-top:.5rem}
  footer{border-top:1px solid var(--line);padding:1rem 1.2rem max(1.2rem,env(safe-area-inset-bottom));
    display:flex;justify-content:center;gap:1.6rem;font-size:.85rem}
  footer a{color:var(--ink2);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
  footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="112 100 288 312" role="img" aria-label="VALKR">
    <defs>
      <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="124" y1="112" x2="388" y2="400">
        <stop offset="0" stop-color="#FFF2CD"/><stop offset=".4" stop-color="#D4AF37"/><stop offset="1" stop-color="#8C6615"/>
      </linearGradient>
    </defs>
    <g fill="url(#g)">
      <path d="M124 112 H388 V142 H124 Z"/>
      <path d="M146 180 L256 400 L366 180 L310 180 L256 296 L198 180 Z"/>
    </g>
  </svg>
  <h1 class="word">VALKR</h1>
  <hr class="rule">
  <p class="claim">Train smarter.</p>
  <p class="soon">COMING SOON</p>
  <figure>
    <img src="valkr-teaser.jpg" width="720" height="1280" alt="The VALKR app on a phone lying on a black leather gym bench">
  </figure>
  <p class="ask">What do you need in a fitness app?
    <small>Tell us in the comments on TikTok. The best comment gets built before launch.</small></p>
</main>
<footer>
  <a href="impressum.html">Impressum</a>
  <a href="datenschutz.html">Datenschutz</a>
</footer>
</body>
</html>
